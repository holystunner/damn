version: '3.8'

services:
  # Main API Service
  agent-factory-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: agent_factory_api
    ports:
      - "8000:8000"
    environment:
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - WORKSPACE_DIR=/app/workspace
      - API_HOST=0.0.0.0
      - API_PORT=8000
      - LOG_LEVEL=info
    volumes:
      # Persist workspace data
      - agent_workspace:/app/workspace
      # Mount core modules for development
      - ./core:/app/core:ro
      - ./api_service.py:/app/api_service.py:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
    networks:
      - agent_factory_network

  # Optional: Redis for caching/queue (uncomment if needed)
  # redis:
  #   image: redis:7-alpine
  #   container_name: agent_factory_redis
  #   ports:
  #     - "6379:6379"
  #   volumes:
  #     - redis_data:/data
  #   networks:
  #     - agent_factory_network
  #   restart: unless-stopped

  # Optional: PostgreSQL for persistent storage (uncomment if needed)
  # postgres:
  #   image: postgres:16-alpine
  #   container_name: agent_factory_postgres
  #   environment:
  #     - POSTGRES_DB=agent_factory
  #     - POSTGRES_USER=factory
  #     - POSTGRES_PASSWORD=${DB_PASSWORD:-changeme}
  #   ports:
  #     - "5432:5432"
  #   volumes:
  #     - postgres_data:/var/lib/postgresql/data
  #   networks:
  #     - agent_factory_network
  #   restart: unless-stopped

  # Optional: Nginx reverse proxy (uncomment for production)
  # nginx:
  #   image: nginx:alpine
  #   container_name: agent_factory_nginx
  #   ports:
  #     - "80:80"
  #     - "443:443"
  #   volumes:
  #     - ./nginx.conf:/etc/nginx/nginx.conf:ro
  #     - ./ssl:/etc/nginx/ssl:ro
  #   depends_on:
  #     - agent-factory-api
  #   networks:
  #     - agent_factory_network
  #   restart: unless-stopped

volumes:
  agent_workspace:
    driver: local
  # redis_data:
  #   driver: local
  # postgres_data:
  #   driver: local

networks:
  agent_factory_network:
    driver: bridge
